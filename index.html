<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Phrase by Phrase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow phone-first column, a pocket phrasebook. English is always "highlighted" like a marker on a notebook page. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#152033; --muted:#5a6477; --line:#dce1e9;
  --accent:#2346c4; --accent-ink:#ffffff; --accent-soft:#e6ebfa;
  --mark:#ffe066; --good:#1d7f55; --warn:#a8670f; --bad:#bb3a34;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e131c; --surface:#171e2b; --ink:#e7ebf2; --muted:#9ca6b8; --line:#283246;
    --accent:#8aa2ff; --accent-ink:#0e131c; --accent-soft:#1e2944;
    --mark:#6a5814; --good:#5fcf98; --warn:#e8b25a; --bad:#f08680;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e131c; --surface:#171e2b; --ink:#e7ebf2; --muted:#9ca6b8; --line:#283246;
  --accent:#8aa2ff; --accent-ink:#0e131c; --accent-soft:#1e2944;
  --mark:#6a5814; --good:#5fcf98; --warn:#e8b25a; --bad:#f08680;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:680px; margin:0 auto; padding-block:20px 64px; display:flex; flex-direction:column; gap:22px}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; line-height:1.15}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.label{font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.en{font-weight:700; background:linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); padding:0 2px; box-decoration-break:clone; -webkit-box-decoration-break:clone}

/* header */
header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; background:none; border:0; padding:0}
.brand h1{font-size:26px; font-weight:800; letter-spacing:-.02em}
.brand .tag{font-family:var(--f-mono); font-size:11px; padding:2px 6px; border:1px solid var(--line); border-radius:6px; color:var(--muted)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface)}
.seg button{border:0; background:none; padding:5px 12px; border-radius:999px; font-size:14px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
nav.tabs{display:flex; gap:6px; border-bottom:1px solid var(--line)}
nav.tabs button{border:0; background:none; padding:10px 12px; font-weight:700; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-1px}
nav.tabs button[aria-current="page"]{color:var(--ink); border-bottom-color:var(--accent)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); padding:11px 18px; border-radius:10px; font-weight:700; min-height:46px}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.block{width:100%}
.icon-btn{display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface); flex:none}
.icon-btn.slow{width:auto; padding:0 12px; border-radius:999px; font-family:var(--f-mono); font-size:12px; letter-spacing:.04em}
.icon-btn svg{width:18px; height:18px; fill:currentColor}
.back{align-self:flex-start; border:0; background:none; padding:4px 0; color:var(--accent); font-weight:700}

/* today panel */
.today{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; gap:14px}
.today h2{font-size:24px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat{display:flex; flex-direction:column; gap:2px}
.stat b{font-family:var(--f-display); font-size:28px; font-variant-numeric:tabular-nums; line-height:1}
.stat span{font-size:13px; color:var(--muted)}
.method{font-size:15px; color:var(--muted)}

/* situations list */
.sits{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
.sit{display:grid; grid-template-columns:1fr auto; gap:4px 14px; align-items:center; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:14px 16px}
.sit:first-child{border-top:0}
.sit:hover{background:var(--accent-soft)}
.sit .t{font-weight:700}
.sit .s{font-size:14px; color:var(--muted)}
.sit .p{grid-row:span 2; display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-family:var(--f-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.bar{width:72px; height:6px; border-radius:3px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--good)}

/* phrase list */
.phrases{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line)}
.phrase{display:grid; grid-template-columns:1fr auto; gap:8px 12px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line)}
.phrase .txt{display:flex; flex-direction:column; gap:3px}
.phrase .fr{color:var(--muted); font-size:15px}
.phrase .note{font-size:13px; color:var(--warn)}
.phrase .ctl{display:flex; gap:6px}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--line); margin-right:6px; vertical-align:middle}
.dot.learning{background:var(--warn)} .dot.known{background:var(--good)}

.subtabs{display:flex; gap:8px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 14px; font-weight:700; font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* dialogue */
.dlg{display:flex; flex-direction:column; gap:12px}
.line{display:flex; gap:10px; align-items:flex-start; max-width:88%}
.line.B{align-self:flex-end; flex-direction:row-reverse; text-align:right}
.bubble{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 14px; display:flex; flex-direction:column; gap:4px}
.line.B .bubble{background:var(--accent-soft); border-color:transparent}
.who{font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.hidden-line{color:var(--muted); font-style:italic}
.line .fr{color:var(--muted); font-size:15px}
.line.playing .bubble{outline:2px solid var(--accent)}

/* review */
.progress{height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); transition:width .25s}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px 20px; display:flex; flex-direction:column; gap:18px; min-height:300px}
.card .prompt{font-family:var(--f-display); font-size:clamp(24px, 6vw, 32px); font-weight:600}
.card .answer{font-size:clamp(22px, 5.5vw, 28px)}
.card .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.card input{width:100%; font:inherit; font-size:18px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
.verdict{font-weight:700; padding:10px 14px; border-radius:10px; border:1px solid currentColor}
.verdict.ok{color:var(--good)} .verdict.close{color:var(--warn)} .verdict.no{color:var(--bad)}
.verdict small{display:block; font-weight:400; color:var(--muted)}
.grades{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.grades .btn{flex-direction:column; gap:0; padding:10px 6px; font-size:15px}
.grades .btn small{font-weight:400; font-size:12px; color:var(--muted)}
.grades .again{border-color:var(--bad); color:var(--bad)}
.grades .hard{border-color:var(--warn); color:var(--warn)}
.grades .good{border-color:var(--good); color:var(--good)}
.big-play{width:88px; height:88px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; align-self:center}
.big-play svg{width:34px; height:34px; fill:currentColor}
.newtag{align-self:flex-start; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:6px; background:var(--mark); color:var(--ink)}

/* tips */
.tips{display:flex; flex-direction:column; gap:12px}
.tip{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:8px}
.tip .pair{display:grid; grid-template-columns:auto 1fr auto; gap:6px 12px; align-items:center}
.tip .wrong{color:var(--bad); text-decoration:line-through; text-decoration-thickness:1px}
.tip .right{color:var(--good); font-weight:700}

nav.tabs{overflow-x:auto}
nav.tabs button{white-space:nowrap; padding:10px}

/* grammar */
.explain{display:flex; flex-direction:column; gap:10px; max-width:62ch}
.tbl{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.tbl table{border-collapse:collapse; width:100%; font-size:15px}
.tbl th,.tbl td{padding:9px 12px; text-align:left; border-top:1px solid var(--line); vertical-align:middle}
.tbl thead th{border-top:0; font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:500}
.tbl td:first-child{font-weight:700}
.tbl td.play{width:1%; padding:4px 8px}
.tbl .icon-btn{width:36px; height:36px}
.auxbox{background:var(--accent-soft); border-left:4px solid var(--accent); border-radius:0 var(--r) var(--r) 0; padding:12px 16px; display:flex; flex-direction:column; gap:6px; max-width:62ch}
.drills{display:flex; flex-direction:column; border-top:1px solid var(--line)}
.drill{display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; align-items:start; padding:14px 0; border-bottom:1px solid var(--line)}
.drill .n{font-family:var(--f-mono); font-size:12px; color:var(--muted); padding-top:8px; font-variant-numeric:tabular-nums}
.drill .q{line-height:2.2}
.drill input{font:inherit; font-weight:700; border:0; border-bottom:2px solid var(--accent); background:var(--accent-soft); color:var(--ink); padding:2px 6px; border-radius:4px 4px 0 0; max-width:100%}
.drill input.ok{border-color:var(--good); color:var(--good)}
.drill input.no{border-color:var(--bad); color:var(--bad)}
.drill .h{grid-column:2; font-size:14px; color:var(--muted)}
.drill .fix{grid-column:2; font-size:14px; color:var(--good); font-weight:700}
.score{font-family:var(--f-display); font-size:22px; font-variant-numeric:tabular-nums}

footer{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted); border-top:1px solid var(--line); padding-top:14px}
footer button{background:none; border:0; color:var(--muted); text-decoration:underline; padding:0}
footer button.danger{color:var(--bad); font-weight:700}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:15px; z-index:20}
@media (max-width:420px){ .stat b{font-size:24px} .line{max-width:100%} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- content ----------
const SITS = [
 {id:'help', fr:"Comprendre et se faire comprendre", en:"Getting by", phrases:[
  ["Sorry, I don't understand.","Désolé, je ne comprends pas."],
  ["Can you repeat that, please?","Vous pouvez répéter, s'il vous plaît ?"],
  ["Can you speak more slowly, please?","Vous pouvez parler plus lentement, s'il vous plaît ?"],

  ["Do you speak French?","Vous parlez français ?"],
  ["Excuse me, can you help me?","Excusez-moi, vous pouvez m'aider ?"]],
  dlg:[
  ['A',"Hi Koffi. Did you get my message this morning?","Salut Koffi. Tu as reçu mon message ce matin ?"],

 {id:'intro', fr:"Se présenter", en:"Introducing yourself", phrases:[

  ["Nice to meet you.","Enchanté."],
  ["I'm from Côte d'Ivoire.","Je viens de Côte d'Ivoire.","On dit aussi « Ivory Coast ». Ivoirien = Ivorian."],

  dlg:[
  ['A',"Hi, I'm Sarah. Are you a student here?","Bonjour, moi c'est Sarah. Tu es étudiant ici ?"],
  ['B',"Yes, I am. My name is Koffi. Nice to meet you.","Oui. Je m'appelle Koffi. Enchanté."],
  ['A',"Nice to meet you too. What are you studying?","Enchantée aussi. Qu'est-ce que tu étudies ?"],
  ['B',"I'm in my third year of finance. How about you? What do you do?","Je suis en troisième année de finance. Et toi ? Tu fais quoi dans la vie ?"],
  ['A',"I'm a nurse. I'm from Ghana, but I live in Abidjan now.","Je suis infirmière. Je viens du Ghana, mais j'habite à Abidjan maintenant."],

 {id:'daily', fr:"Ma journée", en:"Daily routine", phrases:[
  ["I get up at six every morning.","Je me lève à six heures tous les matins."],
  ["I usually take the bus to campus.","D'habitude, je prends le bus pour aller à la fac.","Usually se place avant le verbe : I usually take…"],
  ["I have breakfast at home.","Je prends le petit-déjeuner à la maison."],
  ["My classes start at eight.","Mes cours commencent à huit heures."],
  ["I'm busy all day.","Je suis occupé toute la journée."],
  ["I usually have lunch with friends.","D'habitude, je déjeune avec des amis."],
  ["I get home around six.","Je rentre vers six heures."],
  ["In the evening, I watch TV or read.","Le soir, je regarde la télé ou je lis."],
  ["I go to bed at eleven.","Je me couche à onze heures."],
  ["What do you usually do on Sundays?","Qu'est-ce que tu fais d'habitude le dimanche ?"]],
  dlg:[
  ['A',"You look tired. What time do you get up?","Tu as l'air fatigué. Tu te lèves à quelle heure ?"],
  ['B',"At half past five. My classes start at seven.","À cinq heures et demie. Mes cours commencent à sept heures."],
  ['A',"That's early! How do you get to campus?","C'est tôt ! Tu vas à la fac comment ?"],
  ['B',"I take the bus. It takes about an hour with the traffic.","Je prends le bus. Ça prend environ une heure avec les embouteillages."],
  ['A',"And when do you get home?","Et tu rentres quand ?"],
  ['B',"Around seven. Then I eat, study a bit and go to bed.","Vers sept heures. Ensuite je mange, je travaille un peu et je me couche."],
  ['A',"That's a long day.","C'est une longue journée."],
  ['B',"Yes, but I'm used to it.","Oui, mais j'ai l'habitude."]]},
 {id:'family', fr:"Famille et amis", en:"Family & friends", phrases:[

  ["We call each other every week.","On s'appelle toutes les semaines."],
  ["He's my best friend.","C'est mon meilleur ami."],
  ["We've known each other since primary school.","On se connaît depuis l'école primaire.","Depuis + point de départ : since, avec le present perfect."],

  ["How many brothers and sisters do you have?","Tu as combien de frères et sœurs ?","On dit aussi : Do you have any siblings?"],
  ["We get on very well.","On s'entend très bien."]],
  dlg:[
  ['A',"Do you have any brothers or sisters?","Tu as des frères et sœurs ?"],
  ['B',"Yes, I have two brothers and a sister. I'm the youngest.","Oui, j'ai deux frères et une sœur. Je suis le plus jeune."],

  ['B',"Very close. My older brother helps me a lot.","Très proches. Mon grand frère m'aide beaucoup."],

 {id:'numbers', fr:"Heures, dates et chiffres", en:"Numbers & time", phrases:[

  ["The meeting is at 2 p.m.","La réunion est à 14 h.","En anglais, on dit surtout a.m. (matin) et p.m. (après-midi)."]],
  dlg:[

  ['B',"Half past three. So, 3:30 p.m.?","Trois heures et demie. Donc 15 h 30 ?"],
  ['A',"Yes. At the café next to the bank, in Plateau.","Oui. Au café à côté de la banque, au Plateau."],
  ['B',"OK. Can I have your phone number?","D'accord. Je peux avoir ton numéro ?"],

  ['B',"Got it. See you on Monday!","C'est noté. À lundi !"]]},
 {id:'food', fr:"Manger et boire", en:"Food & eating out", phrases:[

  ["Shall we get something to eat?","On va manger quelque chose ?"],
  ["What would you like to eat?","Qu'est-ce que tu veux manger ?"],
  ["I'd like grilled fish with attiéké, please.","Je voudrais du poisson braisé avec de l'attiéké, s'il vous plaît."],
  ["Is it spicy?","C'est pimenté ?"],
  ["It's delicious!","C'est délicieux !"],

  ["Can we have the bill, please?","L'addition, s'il vous plaît.","Aux États-Unis : the check."]],

 {id:'g-be', kind:'lesson', fr:"Le verbe « to be » (être)", en:'To be', aux:"be est lui-même un auxiliaire : il passe devant le sujet pour la question (Are you…?) et prend not pour la négation (I'm not). Jamais de do avec be.",
  explain:["« To be » veut dire être. C'est le verbe le plus utilisé en anglais. On l'utilise aussi là où le français dit « avoir » : I'm hungry = j'ai faim, I'm cold = j'ai froid, I'm 30 = j'ai 30 ans.",
   "À l'oral, on contracte presque toujours : I am → I'm, you are → you're, it is → it's.",

 {id:'g-aux', kind:'lesson', fr:"Les auxiliaires : le moteur de la phrase", en:'Auxiliaries', aux:"Leçon centrale : chaque leçon de temps vous dira quel auxiliaire elle utilise.",
  explain:["Une idée explique presque toute la grammaire anglaise : chaque phrase a un auxiliaire, un petit verbe qui porte le temps. Les principaux : be (am, is, are, was, were), do (do, does, did), have (have, has), will, can, could.",
   "Question : on met l'auxiliaire devant le sujet. She is tired → Is she tired? Il joue le rôle de « est-ce que », mais il change selon le temps.",
   "Négation : on colle not à l'auxiliaire, et nulle part ailleurs. She is tired → She isn't tired. They will come → They won't come.",
   "Quand on ne voit pas d'auxiliaire (présent simple et prétérit), il est caché. On le fait apparaître avec do, does ou did, et le verbe revient à sa forme de base : She works → Does she work? She doesn't work. They went → Did they go? They didn't go.",
   "Réponses courtes : « Yes » tout seul sonne sec. On répète l'auxiliaire de la question : Are you a student? Yes, I am. Do you speak English? Yes, I do. Did you call him? No, I didn't.",

   "Méthode pour n'importe quelle phrase : 1. Trouvez l'auxiliaire. 2. S'il n'y en a pas, prenez do, does ou did. 3. Déplacez-le pour une question, ajoutez not pour une négation, répétez-le pour une réponse courte."],

// New cards are introduced in this order: a situation, then a grammar lesson, and so on.
const ORDER = []; for(let i=0;i<Math.max(SITS.length,LESSONS.length);i++){ if(SITS[i]) ORDER.push(SITS[i]); if(LESSONS[i]) ORDER.push(LESSONS[i]); }
const GROUPS = Object.fromEntries(ORDER.map(g=>[g.id,g]));
const PH = []; ORDER.forEach(g=>(g.phrases||g.examples).forEach((p,i)=>PH.push({id:g.id+i, sit:g.id, en:p[0], fr:p[1], note:p[2]||''})));
const byId = Object.fromEntries(PH.map(p=>[p.id,p]));
const INTERVALS = [0,1,3,7,14,30,60];
const NEW_PER_DAY = 8;
const KEY = 'pbp-v1';
const today = ()=>{const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};

let S = {cards:{}, days:[], accent:'en-GB', gram:{}, gramT:{}, resetAt:0};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S, JSON.parse(raw)); }catch(e){}
S.gramT = S.gramT || {};
const writeLocal = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const SY = {state: SYNC_URL && USER ? 'idle' : 'off', name:'', at:0, pending:false, busy:false, again:false, timer:null};

// Same function as mergeState in Code.gs: keep both copies identical.
// Per phrase, the most recent change wins; practice days are combined; a reset erases everything older than it.
function mergeState(a, b){
  a = a || {}; b = b || {};
  const r = Math.max(a.resetAt || 0, b.resetAt || 0);
  const cards = {};
  [a.cards || {}, b.cards || {}].forEach(src => Object.keys(src).forEach(id => {
    const c = src[id]; if (!c || (c.t || 0) < r) return;
    if (!cards[id] || (c.t || 0) > (cards[id].t || 0)) cards[id] = c;
  }));
  const gram = {}, gramT = {};
  [a, b].forEach(x => Object.keys(x.gram || {}).forEach(id => {
    const t = (x.gramT || {})[id] || 0; if (t < r) return;
    if (gram[id] == null || x.gram[id] > gram[id]) gram[id] = x.gram[id];
    gramT[id] = Math.max(gramT[id] || 0, t);
  }));
  const newest = (a.resetAt || 0) >= (b.resetAt || 0) ? a : b;
  const rd = r && newest.resetDay != null ? newest.resetDay : -Infinity;
  // Days from a state that already knows the latest reset are kept; older states only keep days after the reset day.
  const keep = x => (x.days || []).filter(d => (x.resetAt || 0) === r ? d >= rd : d > rd);
  const days = Array.from(new Set([].concat(keep(a), keep(b)))).sort((x, y) => x - y);
  return { cards: cards, days: days, accent: b.accent || a.accent || 'en-GB', gram: gram, gramT: gramT, resetAt: r, resetDay: r ? newest.resetDay : undefined };
}

function summary(){
  const t = today(), ids = Object.keys(S.cards).filter(id=>byId[id]);
  const known = ids.filter(id=>S.cards[id].box>=4).length;
  const days = S.days.slice().sort((a,b)=>a-b);
  let streak = 0; for(let d = days.includes(t) ? t : t-1; days.includes(d); d--) streak++;
  const weak = ids.filter(id=>(S.cards[id].l||0)>0).sort((a,b)=>S.cards[b].l-S.cards[a].l).slice(0,6).map(id=>`${byId[id].en} (${S.cards[id].l}×)`);
  const gram = LESSONS.map((l,i)=>S.gram[l.id]!=null ? `L${i+1} ${S.gram[l.id]}/${l.drills.length}` : null).filter(Boolean).join(' · ');
  return {lastDay: days.length ? days[days.length-1] : null, daysPracticed: days.length, streak, seen: ids.length, known,
    learning: ids.length-known, total: PH.length, due: ids.filter(id=>S.cards[id].due<=t).length, grammar: gram, weak: weak.join(' · ')};
}

  if(SY.state==='off') return 'Progression enregistrée sur cet appareil.';
  const who = SY.name ? `${SY.name} · ` : '';
  if(SY.state==='unknown') return 'Lien personnel non reconnu : progression enregistrée sur cet appareil seulement.';
  if(SY.state==='offline') return `${who}Hors ligne : la progression sera envoyée plus tard.`;
  if(SY.state==='ok') return `${who}Synchronisé à ${new Date(SY.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}.`;
  return `${who}Synchronisation…`;
}
function showSync(){ const el=document.getElementById('syncstatus'); if(el) el.textContent=syncText(); }
function syncBody(){ return JSON.stringify({u:USER, state:S, summary:summary()}); }
function scheduleSync(){
  if(SY.state==='off' || SY.state==='unknown') return;
  SY.pending = true; clearTimeout(SY.timer); SY.timer = setTimeout(push, 8000);
}
async function pull(){
  if(SY.state==='off') return;
  try{
    const j = await (await fetch(`${SYNC_URL}?u=${encodeURIComponent(USER)}`)).json();
    if(!j.ok){ SY.state = j.error==='unknown' ? 'unknown' : 'offline'; showSync(); return; }
    SY.name = j.name || '';
    if(j.state){ S = mergeState(j.state, S); writeLocal(); }
    SY.state='ok'; SY.at=Date.now();
    if(view.name==='home' || view.name==='grammar') render(); else showSync();
    push();
  }catch(e){ SY.state='offline'; showSync(); }
}
async function push(){
  clearTimeout(SY.timer);
  if(SY.state==='off' || SY.state==='unknown') return;
  if(SY.busy){ SY.again=true; return; }
  SY.busy=true; SY.pending=false;
  try{
    const j = await (await fetch(SYNC_URL, {method:'POST', body:syncBody()})).json();
    if(j.ok){ if(j.state){ S = mergeState(j.state, S); writeLocal(); } SY.state='ok'; SY.at=Date.now(); }
    else if(j.error==='unknown') SY.state='unknown';
    else { SY.pending=true; SY.state='offline'; }
  }catch(e){ SY.pending=true; SY.state='offline'; }
  SY.busy=false; showSync();
  if(SY.again){ SY.again=false; push(); }
}
document.addEventListener('visibilitychange', ()=>{

});

function pickVoice(alt){
  const vs = voices.filter(v=>v.lang && v.lang.replace('_','-').startsWith(S.accent));
  const pool = vs.length ? vs : voices.filter(v=>v.lang && v.lang.startsWith('en'));
  if(!pool.length) return null;
  const pref = pool.filter(v=>/natural|google|online|neural/i.test(v.name));
  const list = pref.length ? pref : pool;
  return list[alt ? Math.min(1, list.length-1) : 0];
}
function speak(text, slow, onend, alt){
  if(!('speechSynthesis' in window)){ toast('L\'audio n\'est pas disponible dans ce navigateur.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = S.accent; const v = pickVoice(alt); if(v) u.voice = v;
  u.rate = slow ? 0.62 : 0.92; if(alt && !v) u.pitch = 1.25;
  if(onend){ u.onend = onend; u.onerror = onend; }
  speechSynthesis.speak(u);
}

const CONTR = {"i'm":"i am","you're":"you are","it's":"it is","that's":"that is","what's":"what is","don't":"do not","doesn't":"does not","can't":"cannot","i'd":"i would","i've":"i have","i'll":"i will","we're":"we are","they're":"they are","isn't":"is not","won't":"will not","let's":"let us","here's":"here is","aren't":"are not","wasn't":"was not","weren't":"were not","didn't":"did not","haven't":"have not","hasn't":"has not","couldn't":"could not","wouldn't":"would not","he's":"he is","she's":"she is","there's":"there is","we'll":"we will","you'll":"you will","they'll":"they will","he'll":"he will","she'll":"she will","it'll":"it will","'m":"am","'re":"are","'s":"is","'ll":"will"};

function lev(a,b){ const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }

         <label class="label" for="ans" style="text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:14px">Dites-le à voix haute, ou écrivez-le (facultatif)</label>
         <input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écrivez en anglais…" value="${esc(R.typed)}">
         <button class="btn primary block" data-act="show" style="margin-top:auto">Voir la réponse</button>`;
  } else {
    let verdict = '';
    if(R.mode==='write' && R.typed.trim()){
      const a=norm(R.typed), b=norm(p.en), d=lev(a,b);
      verdict = d===0 ? `<div class="verdict ok">Parfait.</div>`
        : d <= Math.max(2, Math.round(b.length*0.12)) ? `<div class="verdict close">Presque.<small>Vous avez écrit : ${esc(R.typed)}</small></div>`
        : `<div class="verdict no">Pas encore.<small>Vous avez écrit : ${esc(R.typed)}</small></div>`;
    }
    inner = `<span class="label">${esc(s.fr)}</span>
      <p class="answer"><span class="en">${esc(p.en)}</span></p>
      <p class="muted">${esc(p.fr)}</p>${p.note?`<p class="muted" style="font-size:14px;color:var(--warn)">${esc(p.note)}</p>`:''}
      ${verdict}
      <div class="row">${playBtns(p.id,p.en)}</div>
      <div class="grades" style="margin-top:auto">
        <button class="btn again" data-act="grade" data-v="again">Pas su<small>maintenant</small></button>
        <button class="btn hard" data-act="grade" data-v="hard">Difficile<small>demain</small></button>
        <button class="btn good" data-act="grade" data-v="good">Je savais<small>${(()=>{const b=Math.min((S.cards[p.id]?.box||0)+1,6), d=INTERVALS[b]; return d<=1?'demain':`dans ${d} j`})()}</small></button>
      </div>`;
  }
  return `<button class="back" data-act="${R.sit?'backsit':'home'}">← ${R.sit?(GROUPS[R.sit].kind==='lesson'?'Retour à la leçon':'Retour à la situation'):'Arrêter'}</button>
    ${R.extra?'<p class="method">Rien à revoir ici aujourd\'hui : entraînement libre sur toute la situation.</p>':''}
    ${modeSel}
    <div style="display:flex;flex-direction:column;gap:6px"><div class="progress"><i style="width:${pct}%"></i></div><span class="label" style="font-variant-numeric:tabular-nums">${R.i+1} / ${R.q.length}</span></div>
    <section class="card">${inner}</section>`;
}
function markDay(){ const t=today(); if(!S.days.includes(t)) S.days.push(t); }
function grade(v){
  const it=R.q[R.i], t=today(); const c = S.cards[it.id] || {box:0, due:t, intro:t};
  c.t = Date.now();
  if(v==='again'){ c.box=0; c.due=t; c.l=(c.l||0)+1; R.tries[it.id]=(R.tries[it.id]||0)+1; if(R.tries[it.id]<3) R.q.push({id:it.id}); }
  else if(v==='hard'){ c.box=Math.max(1,c.box); c.due=t+1; }
  else { c.box=Math.min(c.box+1,6); c.due=t+INTERVALS[c.box]; }
  S.cards[it.id]=c; R.results[v]++; markDay(); save();
  R.i++; R.revealed=false; R.typed=''; render(); autoplay();
}

// ---------- render & events ----------
function render(){
  const app=document.getElementById('app');
  let main = view.name==='sit' ? sitView() : view.name==='tips' ? tipsView() : view.name==='review' ? reviewView()
    : view.name==='grammar' ? grammarView() : view.name==='lesson' ? lessonView() : homeView();
  app.innerHTML = header() + main + footer();
  app.querySelectorAll('.en, .tip .right').forEach(el=>el.lang='en');
  document.querySelectorAll('[data-drill]').forEach(inp=>{
    const i = +inp.dataset.drill;
    inp.addEventListener('input', e=>view.ans[i]=e.target.value);
    inp.addEventListener('keydown', e=>{ if(e.key!=='Enter') return; e.preventDefault();
      const n=document.querySelector(`[data-drill="${i+1}"]`); if(n) n.focus(); else document.querySelector('[data-act="check"]')?.click(); });
  });
  const ans=document.getElementById('ans'); if(ans){ ans.addEventListener('input',e=>R.typed=e.target.value); ans.addEventListener('keydown',e=>{ if(e.key==='Enter'){ R.revealed=true; render(); speak(byId[R.q[R.i].id].en); } }); }
}
function go(v){ window.speechSynthesis?.cancel(); view=v; confirmReset=false; render(); window.scrollTo(0,0); }
let chainToken = 0;
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='home') go({name:'home'});
  else if(a==='tips') go({name:'tips'});
  else if(a==='review'){ if(R && R.i<R.q.length && view.name!=='review'){ view={name:'review'}; render(); } else startReview(null); }
  else if(a==='startall') startReview(null);
  else if(a==='sit'){ sitTab='phrases'; go({name:'sit', id:b.dataset.id}); }
  else if(a==='backsit'){ go(GROUPS[R.sit].kind==='lesson' ? {name:'lesson', id:R.sit, ans:[], checked:false} : {name:'sit', id:R.sit}); }
  else if(a==='grammar') go({name:'grammar'});
  else if(a==='lesson') go({name:'lesson', id:b.dataset.id, ans:[], checked:false});
  else if(a==='check'){ const l=GROUPS[view.id]; const sc=l.drills.filter((d,i)=>drillOk(d, view.ans[i])).length;
    view.checked=true; S.gram[l.id]=Math.max(S.gram[l.id]||0, sc); S.gramT[l.id]=Date.now(); markDay(); save(); render();
    toast(sc===l.drills.length ? 'Tout est juste !' : `${sc} / ${l.drills.length}. Écoutez les corrections, puis recommencez.`); }
  else if(a==='redo'){ view.ans=[]; view.checked=false; render(); document.querySelector('[data-drill="0"]')?.focus(); }
  else if(a==='sittab'){ sitTab=b.dataset.v; render(); }
  else if(a==='say') speak(byId[b.dataset.id].en);
  else if(a==='slow') speak(byId[b.dataset.id].en, true);
  else if(a==='saytxt') speak(b.dataset.t);
  else if(a==='accent'){ S.accent=b.dataset.v; save(); render(); speak(S.accent==='en-GB'?'Hello! This is a British voice.':'Hi! This is an American voice.'); }
  else if(a==='practice') startReview(b.dataset.id);
  else if(a==='togglefr'){ showFr=!showFr; render(); }
  else if(a==='role'){ rolePlay=!rolePlay; view.shown=[]; render(); }
  else if(a==='reveal'){ view.shown=(view.shown||[]).concat(+b.dataset.i); render(); }
  else if(a==='sayline'){ const s=SITS.find(x=>x.id===view.id), l=s.dlg[+b.dataset.i]; speak(l[1], false, null, l[0]==='A'); }
  else if(a==='playall'){
    const s=SITS.find(x=>x.id===view.id), tok=++chainToken; let i=0;
    const next=()=>{ document.querySelectorAll('.line.playing').forEach(x=>x.classList.remove('playing')); if(tok!==chainToken || i>=s.dlg.length) return;
      const el=document.getElementById('l'+i); if(el){ el.classList.add('playing'); el.scrollIntoView({block:'nearest'}); }
      const l=s.dlg[i++]; speak(l[1], false, ()=>setTimeout(next, rolePlay&&s.dlg[i]?.[0]==='B'?2500:400), l[0]==='A'); };
    next();
  }
  else if(a==='mode'){ R.mode=b.dataset.v; R.revealed=false; render(); autoplay(); }
  else if(a==='show'){ R.revealed=true; render(); speak(byId[R.q[R.i].id].en); }
  else if(a==='learned'){ const it=R.q[R.i], t=today(); S.cards[it.id]={box:0, due:t, intro:t, t:Date.now()}; markDay(); save(); R.q.push({id:it.id}); R.i++; render(); autoplay(); }
  else if(a==='grade') grade(b.dataset.v);
  else if(a==='reset'){ confirmReset=true; render(); }
  else if(a==='reset-no'){ confirmReset=false; render(); }
  else if(a==='reset-yes'){ S={cards:{}, days:[], accent:S.accent, gram:{}, gramT:{}, resetAt:Date.now(), resetDay:today()}; writeLocal(); push(); R=null; confirmReset=false; go({name:'home'}); toast('Progression effacée.'); }
});
document.addEventListener('keydown', e=>{
  const b=e.target.closest?.('[role="button"][data-act]'); if(b && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); b.click(); }
});
render();
pull();
</script>

</body></html>
